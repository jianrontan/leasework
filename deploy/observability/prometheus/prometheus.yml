global:
  scrape_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: api
    static_configs:
      - targets: ["api:8080"]

  - job_name: scheduler
    static_configs:
      - targets: ["scheduler:9102"]

  # Worker is discovered via Docker's embedded DNS instead of a static
  # target: `make scale N=3` runs several worker containers behind the same
  # service name, and a DNS A-record lookup returns every replica's IP so
  # Prometheus scrapes all of them. A static target would only ever hit one
  # replica and make the scaling demo lie.
  - job_name: worker
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9101
